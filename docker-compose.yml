services:
  reservations:
    build:
      context: .
      dockerfile: ./apps/reservations/Dockerfile
      target: development

    container_name: lunar_reservations
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: pnpm run start:dev reservations

  mongo:
    image: mongo:latest
    container_name: lunar_mongo
    restart: always
    ports:
      - "27017:27017"